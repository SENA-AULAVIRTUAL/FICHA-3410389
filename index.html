<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal SENA - Omar Pardey</title>
<meta name="theme-color" content="#39A900">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at top,#0a2e00,#000);display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:400px;width:100%;background:#fff;border-radius:26px;padding:32px 26px;text-align:center;border-top:8px solid #39A900;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.logo{width:110px;display:block;margin:0 auto 16px}
h1{color:#39A900;font-size:24px;line-height:1.1;font-weight:900}
.sub{color:#333;font-size:14px;margin:12px 0 22px;line-height:1.4}
input{width:100%;padding:18px;border-radius:14px;border:2px solid #ddd;font-size:24px;text-align:center;font-weight:900;letter-spacing:3px;color:#1e5a00}
input:focus{border-color:#39A900;outline:none;box-shadow:0 0 0 4px #eaffdb}
.btn{width:100%;background:#39A900;color:#fff;border:none;padding:18px;border-radius:14px;font-size:18px;font-weight:900;cursor:pointer;margin-top:14px}
.error{display:none;margin-top:14px;background:#ffebeb;color:#b10000;padding:12px;border-radius:10px;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="https://opardey1.github.io/FICHA-3410389/logoSena.png" alt="SENA" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/8/83/Sena_Colombia_logo.svg'">
  <h1>INSTRUCTOR<br>OMAR PARDEY</h1>
  <p class="sub">Centro Colombo Alemán<br><b>Portal Virtual</b><br>Producción de Componentes Mecánicos</p>
  <input id="ficha" type="number" placeholder="Escribe tu ficha" inputmode="numeric">
  <button class="btn" onclick="entrar()">ENTRAR →</button>
  <div id="error" class="error">❌ Ficha no encontrada. Crea el archivo <span id="nombreError"></span>.html</div>
</div>

<script>
function entrar(){
  const num = document.getElementById('ficha').value.trim();
  const error = document.getElementById('error');
  const nombreError = document.getElementById('nombreError');
  
  if(!num){ return; }

  // Esta es la magia: busca un archivo que se llame igual que la ficha
  // Si pones 3410389 -> te manda a 3410389.html
  const archivoDestino = num + ".html";

  // Intenta cargar el archivo, si no existe muestra error
  fetch(archivoDestino, {method: 'HEAD'})
    .then(res => {
      if(res.ok){
        window.location.href = archivoDestino;
      }else{
        nombreError.innerText = num;
        error.style.display = 'block';
        setTimeout(()=> error.style.display='none', 4000);
      }
    })
    .catch(()=>{
      // Si falla el fetch (por GitHub), igual intenta redirigir
      window.location.href = archivoDestino;
    });
}
document.getElementById('ficha').addEventListener('keypress', e=>{if(e.key==='Enter') entrar();});
</script>
</body>
</html>
