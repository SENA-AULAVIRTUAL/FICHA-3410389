<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructor Omar Pardey - SENA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="FICHA-3410389/logoSena.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:radial-gradient(circle at top,#0a2e00,#000);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{max-width:430px;width:100%;background:white;color:#222;border-radius:22px;padding:32px;box-shadow:0 25px 60px rgba(0,0,0,.6);text-align:center;border-top:8px solid #39A900;animation:entrada.6s}
@keyframes entrada{from{transform:translateY(30px);opacity:0} to{transform:translateY(0);opacity:1}}
.logo{width:95px;margin-bottom:12px}
h1{color:#39A900;font-size:26px;letter-spacing:.5px}
.sub{color:#666;font-size:14px;margin:10px 0 24px;line-height:1.4}
input{width:100%;padding:16px;border-radius:12px;border:2px solid #ddd;margin:10px 0;font-size:20px;text-align:center;font-weight:bold;letter-spacing:2px}
input:focus{border-color:#39A900;outline:none;box-shadow:0 0 0 3px #eaffdb}
.btn{width:100%;background:#39A900;color:white;border:none;padding:16px;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:12px;transition:.2s}
.btn:hover{background:#2d7a00;transform:scale(1.02)}
.fichas{display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.tag{background:#eaffdb;color:#1e5a00;padding:7px 14px;border-radius:20px;font-size:13px;font-weight:bold;cursor:pointer}
.tag:hover{background:#39A900;color:white}
.error{display:none;background:#ffebeb;color:#a00;padding:12px;border-radius:10px;margin-top:14px;font-size:14px}
.hint{font-size:12px;color:#999;margin-top:16px}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="FICHA-3410389/logoSena.png" alt="SENA">
<h1>INSTRUCTOR<br>OMAR PARDEY</h1>
<p class="sub">Centro Colombo Alemán<br><b>Portal Oficial de Fichas CNC</b></p>

<input id="ficha" type="number" placeholder="EJ: 3410389" inputmode="numeric">
<button class="btn" onclick="ingresar()">ENTRAR A MI FICHA ➔</button>

<div id="error" class="error">❌ Esa ficha no existe. Verifica el número con tu instructor.</div>

<div class="fichas">
<span class="tag" onclick="poner('3410389')">FICHA 3410389</span>
<span class="tag" onclick="poner('3410098')">FICHA 3410098</span>
</div>

<p class="hint">💡 Toca tu ficha o escribe tu número y entra directo a tu taller virtual</p>
<p style="font-size:10px;color:#bbb;margin-top:12px">SENA Colombo Alemán | 2026</p>
</div>

<script>
const fichas = {
  "3410389": "FICHA-3410389/",
  "3410098": "FICHA-3410098/"
};
function poner(num){ document.getElementById('ficha').value=num; ingresar(); }
function ingresar(){
  const f = document.getElementById('ficha').value.trim();
  const e = document.getElementById('error');
  if(fichas[f]){
    window.location.href = fichas[f];
  } else {
    e.style.display='block';
    setTimeout(()=>e.style.display='none',3000);
  }
}
document.getElementById('ficha').addEventListener('keypress',function(e){ if(e.key==='Enter'){ ingresar(); }});
</script>
</body>
</html>
